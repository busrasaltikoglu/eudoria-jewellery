<!-- JavaScript Fonksiyonları -->
    <script>
        let aktifFotograflar = [];
        let aktifFotoIndex = 0;

        // Sayfa / Sekme Geçiş Fonksiyonu
        function sayfaGoster(sayfaId, event) {
            event.preventDefault();
            var sayfalar = document.querySelectorAll('.sayfa-icerik');
            sayfalar.forEach(function(sayfa) {
                sayfa.classList.remove('aktif-sayfa');
            });
            document.getElementById(sayfaId).classList.add('aktif-sayfa');

            var menuLinkleri = document.querySelectorAll('.nav-links a');
            menuLinkleri.forEach(function(link) {
                link.classList.remove('aktif-link');
            });
            event.target.classList.add('aktif-link');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Ürün Detay Modalı Açma
        function urunDetayAc(baslik, fiyat, fotolar, aciklama) {
            aktifFotograflar = fotolar;
            aktifFotoIndex = 0;
            
            document.getElementById('modal-img').src = aktifFotograflar[aktifFotoIndex];
            document.getElementById('modal-title').textContent = baslik;
            document.getElementById('modal-price').textContent = fiyat;
            document.getElementById('modal-desc').innerHTML = aciklama;
            
            // Modal içindeki sepete ekle butonuna doğru verileri bağla
            const modalAddBtn = document.getElementById('modal-add-btn');
            modalAddBtn.setAttribute('data-name', baslik);
            modalAddBtn.setAttribute('data-price', parseFloat(fiyat.replace(' TL', '').trim()));
            modalAddBtn.setAttribute('data-img', aktifFotograflar[0]);

            document.getElementById('urun-modal').style.display = 'flex';
        }

        function modalKapatTikla() {
            document.getElementById('urun-modal').style.display = 'none';
        }

        function modalKapat(event) {
            if (event.target.id === 'urun-modal') {
                document.getElementById('urun-modal').style.display = 'none';
            }
        }

        // Galeri Fotoğraf Değiştirme
        function fotografDegistir(yon) {
            if (aktifFotograflar.length === 0) return;
            aktifFotoIndex += yon;
            if (aktifFotoIndex < 0) {
                aktifFotoIndex = aktifFotograflar.length - 1;
            } else if (aktifFotoIndex >= aktifFotograflar.length) {
                aktifFotoIndex = 0;
            }
            document.getElementById('modal-img').src = aktifFotograflar[aktifFotoIndex];
        }

        // Arama Modalı Fonksiyonları
        function aramaModaliniAc() {
            document.getElementById('search-overlay').style.display = 'flex';
            document.getElementById('search-input').focus();
        }

        function disarinaTiklandi(event) {
            if (event.target.id === 'search-overlay') {
                document.getElementById('search-overlay').style.display = 'none';
            }
        }

        // Basit Ürün Arama Motoru
        function urunleriAra(arananMetin) {
            const resultsContainer = document.getElementById('search-results');
            const aranan = arananMetin.toLowerCase().trim();

            if (aranan === '') {
                resultsContainer.innerHTML = '<p style="color: #666; font-size: 14px; margin-top: 20px;">Aramak istediğiniz ürün adını yazmaya başlayın...</p>';
                return;
            }

            // Sayfadaki tüm ürün kartlarını tara
            const tumUrunler = document.querySelectorAll('.sayfa-icerik .urun-karti');
            let bulunanlar = '';

            tumUrunler.forEach(card => {
                const baslik = card.querySelector('h3').textContent;
                const fiyat = card.querySelector('.fiyat').textContent;
                const img = card.querySelector('img').getAttribute('src');
                const onclickAttr = card.getAttribute('onclick');

                if (baslik.toLowerCase().includes(aranan)) {
                    bulunanlar += `
                        <div class="urun-karti" onclick="${onclickAttr}; document.getElementById('search-overlay').style.display='none';">
                            <img src="${img}" alt="${baslik}">
                            <h3>${baslik}</h3>
                            <p class="fiyat">${fiyat}</p>
                            <button class="add-to-cart-btn" onclick="event.stopPropagation();" data-name="${baslik}" data-price="${parseFloat(fiyat)}" data-img="${img}">SEPETE EKLE</button>
                        </div>
                    `;
                }
            });

            if (bulunanlar === '') {
                resultsContainer.innerHTML = '<p style="color: #666; font-size: 14px; margin-top: 20px;">Aradığınız kriterlere uygun ürün bulunamadı.</p>';
            } else {
                resultsContainer.innerHTML = bulunanlar;
            }
        }

        // Yasal Metinler İçin İçerikler
        const yasalMetinler = {
            'mesafeli': {
                baslik: 'Mesafeli Satış Sözleşmesi',
                icerik: `<ul>
                    <li><strong>1. Taraflar:</strong> İşbu Sözleşme, Eudoria Jewellery ile Alıcı arasında gerçekleştirilmektedir.</li>
                    <li><strong>2. Konu:</strong> Alıcının, satıcıya ait internet sitesinden elektronik ortamda siparişini verdiği ürünün satışı ve teslimi ile ilgili hak ve yükümlülüklerin belirlenmesidir.</li>
                    <li><strong>3. Teslimat:</strong> Ürün, Alıcının belirttiği teslimat adresine kargo yoluyla gönderilir. Kargo ücreti ve süreleri sipariş aşamasında belirtilir.</li>
                </ul>`
            },
            'iade': {
                baslik: 'İptal ve İade Koşulları',
                icerik: `<ul>
                    <li>Tüketici, cayma hakkını kullanabilir. Takı ve aksesuar ürünlerinde hijyen kuralları gereği kullanılmamış, ambalajı zarar görmemiş ürünler iade edilebilir.</li>
                    <li>İade edilecek ürünün kargo ücreti alıcıya ait olabilir ya da anlaşmalı kargo kodumuz ile gönderilebilir.</li>
                </ul>`
            },
            'kvkk': {
                baslik: 'Gizlilik ve KVKK',
                icerik: `<ul>
                    <li>Kişisel verileriniz, 6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK) uyarınca işlenmektedir.</li>
                    <li>Sipariş işlemlerinizin gerçekleştirilmesi, kargo teslimatı ve müşteri hizmetleri dışındaki hiçbir amaçla 3. şahıslarla paylaşılmaz.</li>
                </ul>`
            }
        };

        function yasalMetinAc(tur) {
            const metin = yasalMetinler[tur];
            if (metin) {
                document.getElementById('yasal-modal-title').textContent = metin.baslik;
                document.getElementById('yasal-modal-body').innerHTML = metin.icerik;
                document.getElementById('yasal-modal').style.display = 'flex';
            }
        }

        function yasalModalKapat() {
            document.getElementById('yasal-modal').style.display = 'none';
        }

        function yasalModalKapatDis(event) {
            if (event.target.id === 'yasal-modal') {
                document.getElementById('yasal-modal').style.display = 'none';
            }
        }
    </script>
